name: Tandem to Nightscout sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet "tconnectsync" "requests"

      - name: Run sync (guardian-account BFF path)
        env:
          TCONNECT_EMAIL: ${{ secrets.TCONNECT_EMAIL }}
          TCONNECT_PASSWORD: ${{ secrets.TCONNECT_PASSWORD }}
          NS_URL: ${{ secrets.NS_URL }}
          NS_SECRET: ${{ secrets.NS_SECRET }}
          PUMP_SERIAL_NUMBER: ${{ secrets.PUMP_SERIAL_NUMBER }}
        run: python mobi_sync.py

      - name: Keep Nightscout site awake
        if: always()
        run: |
          curl -fsS "${{ secrets.NS_URL }}/api/v1/status.json" > /dev/null \
            && echo "Nightscout responded OK" \
            || echo "Ping failed (non-fatal, will retry next run)"

      - name: Record last run timestamp
        if: always()
        run: |
          mkdir -p status
          date -u +"Last sync attempt: %Y-%m-%d %H:%M UTC" > status/last_run.txt
          git config user.name "mobi-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status/last_run.txt
          git diff --staged --quiet || git commit -m "Update sync status [skip ci]"
          git push
